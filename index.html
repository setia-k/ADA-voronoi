<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Voronoi diagram built with the divide-and-conquer algorithm (Algorithms term project, NSYSU).">
  <title>Voronoi Diagram (Divide and Conquer)</title>
  <link rel="stylesheet" href="style.css">
  <script src="dist/app.js" defer></script>
</head>
<body>
  <main id="app">
    <h1 class="visually-hidden">Setia Kurniawan - M143040114</h1>
    <canvas id="canvas" width="600" height="600"
            aria-label="Drawing canvas: click to add points">
      I hope your browser support canvas
    </canvas>
    <aside id="sidebar" aria-label="Controls">

      <fieldset aria-label="Input">
        <button type="button" id="btnLoadInput">Load input file</button>
        <input type="file" id="fileInput" accept=".in,.txt" hidden aria-label="Input file">
        <select id="caseSelect" name="caseSelect" aria-label="Test case" disabled>
          <option>No file loaded</option>
        </select>
        <button type="button" id="btnNextCase" aria-keyshortcuts="Enter">Next case (Enter)</button>
        <button type="button" id="btnClearInput">Clear input file</button>
        <output id="caseInfo"></output>
      </fieldset>

      <fieldset aria-label="Execute">
        <button type="button" id="btnNext">Next step ▶</button>
        <div class="row">
          <label for="stepCount">Step by</label>
          <input type="number" id="stepCount" name="stepCount" value="10" min="1">
          <button type="button" id="btnStepN">Go</button>
        </div>
        <button type="button" id="btnRun">Run ▶▶</button>
        <button type="button" id="btnReset">Reset</button>
        <output id="stepInfo">Step 0 / 0</output>
      </fieldset>

      <fieldset aria-label="Output">
        <button type="button" id="btnSaveOutput">Save output file</button>
        <button type="button" id="btnLoadOutput">Load output file</button>
        <input type="file" id="fileOutput" accept=".txt" hidden aria-label="Output file to load">
      </fieldset>

      <fieldset aria-label="Edit">
        <div class="row">
          <button type="button" id="btnUndo">Undo point</button>
          <button type="button" id="btnClear">Clear</button>
        </div>
        <label><input type="checkbox" id="chkHull" name="showHull"> Show convex hull</label>
      </fieldset>

      <!-- Info: mouse position, the loaded points, and status messages -->
      <fieldset aria-label="Info">
        <output id="mousePos">Mouse: -, -</output>
        <output id="pointCount">Points: 0</output>
        <pre id="pointList" aria-label="Point list"></pre>
        <p id="status" role="status" aria-live="polite"></p>
      </fieldset>

    </aside>
  </main>
</body>
</html>
